services:
  sqlserver:
      platform: linux/amd64
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: employee-task-sqlserver

      environment:
        MSSQL_SA_PASSWORD: "Password@111"
        ACCEPT_EULA: "Y"

      ports:
        - "1433:1433"

      volumes:
        - employee_task_sql_data:/var/opt/mssql  

      restart: unless-stopped  

volumes:
  employee_task_sql_data:    